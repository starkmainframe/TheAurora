[platformio]
default_envs = esp32-s3-amoled-143, esp32-s3-amoled-175

[amoled_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINOJSON_SLOT_ID_SIZE=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ 7.4.2


[env:esp32-s3-amoled-143]
extends = amoled_common
build_flags = ${amoled_common.build_flags} -DBOARD_AMOLED_143

[env:esp32-s3-amoled-175]
extends = amoled_common
build_flags = ${amoled_common.build_flags} -DBOARD_AMOLED_175
